# Weekly checks for outdated or vulnerable dependencies. Each ecosystem is grouped into a single PR,
# so a normal week brings at most two: one for npm dev dependencies, one for workflow actions.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      # typescript-eslint only supports TypeScript up to 6.0; remove this once it supports 7
      - dependency-name: typescript
        versions: ['>=7.0.0']
    groups:
      dev-dependencies:
        dependency-type: development
      dependencies:
        dependency-type: production
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ['*']
